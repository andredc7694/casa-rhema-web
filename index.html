<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Rhema | ¿Qué es el amor?</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<!-- PANTALLA INICIAL -->
<div id="gate">
    <div class="gate-content">
        <h1 id="mainText"></h1>
        <p id="subText"></p>
        <p id="countdown"></p>

        <div id="scrollInvite" class="hidden">
            <span>PRESIONA!!</span>
            <div class="line"></div>
        </div>
    </div>
</div>

<!-- SLIDES -->
<section class="slide"><img src="images/pagina1.jpeg"></section>
<section class="slide"><img src="images/pagina2.jpeg"></section>
<section class="slide"><img src="images/pagina3.jpeg"></section>
<section class="slide"><img src="images/pagina4.jpeg"></section>
<section class="slide"><img src="images/pagina5.jpeg"></section>
<section class="slide"><img src="images/pagina6.jpeg"></section>
<section class="slide"><img src="images/pagina7.jpeg"></section>
<section class="slide"><img src="images/pagina8.jpeg"></section>

<!-- BOTONES FLOTANTES -->
<div class="social-buttons">
    <a href="https://www.facebook.com/casarhemacentral" target="_blank" class="facebook">
        <i class="fab fa-facebook-f"></i>
    </a>
    <a href="https://www.instagram.com/iglesiarhema_ayac?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="instagram">
        <i class="fab fa-instagram"></i>
    </a>
</div>

<!-- BOTÓN VOLVER ARRIBA -->
<button id="topBtn">
    <i class="fas fa-arrow-up"></i>
</button>

<!-- MÚSICA -->
<audio id="bgMusic" loop>
    <source src="music/audio.mp3" type="audio/mp3">
</audio>

<script>
const text1 = "El amor no es lo que muchos creen…";
const text2 = "Hoy lo descubrirás.";
const mainText = document.getElementById("mainText");
const subText = document.getElementById("subText");
const countdownEl = document.getElementById("countdown");
const scrollInvite = document.getElementById("scrollInvite");
const gate = document.getElementById("gate");
const topBtn = document.getElementById("topBtn");

let i = 0;
let unlocked = false;

/* EFECTO MAQUINA */
function typeWriter() {
    if (i < text1.length) {
        mainText.innerHTML += text1.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
    } else {
        setTimeout(() => {
            subText.style.opacity = 1;
        }, 500);
    }
}
typeWriter();

subText.innerText = text2;

/* CUENTA REGRESIVA */
let count = 3;
countdownEl.innerText = count;

let timer = setInterval(() => {
    count--;
    countdownEl.innerText = count;

    if (count <= 0) {
        clearInterval(timer);
        countdownEl.innerText = "";
        scrollInvite.classList.remove("hidden");
    }
}, 1000);

/* DESBLOQUEO PROFESIONAL (SIN BLOQUEAR CELULAR) */
/* MOSTRAR BOTÓN ARRIBA */
window.addEventListener("scroll", function() {
    if (window.scrollY > window.innerHeight) {
        topBtn.style.display = "block";
    } else {
        topBtn.style.display = "none";
    }
});

/* DESBLOQUEO Y MÚSICA CON INTERACCIÓN REAL */
document.addEventListener("touchstart", firstInteraction, { once: true });
document.addEventListener("click", firstInteraction, { once: true });

function firstInteraction() {
    if (!unlocked) {
        unlock();
    }
}

function unlock(){
    unlocked = true;

    const music = document.getElementById("bgMusic");

    if(music){
        music.volume = 0;
        music.play().then(() => {
            // Fade in suave
            let vol = 0;
            const fade = setInterval(() => {
                if (vol < 0.3) {
                    vol += 0.02;
                    music.volume = vol;
                } else {
                    clearInterval(fade);
                }
            }, 200);
        }).catch(() => {});
    }

    gate.classList.add("fadeOut");

    setTimeout(()=>{
        gate.style.display = "none";
    },800);
}

/* ACTIVAR MÚSICA EN PRIMER TOQUE REAL (MÓVIL Y PC) */
const music = document.getElementById("bgMusic");

function startMusic() {
    if (music.paused) {
        music.volume = 0.3;
        music.play().catch(() => {});
    }
}

document.addEventListener("touchstart", startMusic, { once: true });
document.addEventListener("click", startMusic, { once: true });

function unlock(){
    unlocked = true;

    const music = document.getElementById("bgMusic");
    if(music){
        music.volume = 0.3;
        music.play().catch(() => {});
    }

    gate.classList.add("fadeOut");

    setTimeout(()=>{
        gate.style.display = "none";
        window.scrollTo(0,0);
    },800);
}

/* BOTÓN VOLVER ARRIBA */
topBtn.onclick = function () {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
};
</script>

</body>
</html>
